name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            frontend=true
            backend=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed_files"

            frontend=false
            backend=false

            if grep -Eq '^(apps/web/|packages/block-editor/|Dockerfile\.web$|railway\.json$|\.dockerignore$|package\.json$|bun\.lock$|turbo\.json$|scripts/ci\.sh$|\.github/workflows/)' <<<"$changed_files"; then
              frontend=true
            fi

            if grep -Eq '^(services/backend/|\.dockerignore$|scripts/ci\.sh$|\.github/workflows/)' <<<"$changed_files"; then
              backend=true
            fi
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend and editor
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Production build
        run: bun run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test --skip-update --enable-swift-testing --disable-xctest --no-parallel
      - name: Release build
        run: swift build -c release --product App --skip-update

  gate:
    name: Required CI gate
    if: always()
    needs: [changes, frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all affected services to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$FRONTEND_RESULT" == "success" || "$FRONTEND_RESULT" == "skipped" ]]
          [[ "$BACKEND_RESULT" == "success" || "$BACKEND_RESULT" == "skipped" ]]
